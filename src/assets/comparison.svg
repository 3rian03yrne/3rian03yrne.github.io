<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Without MCP versus with MCP</title>
<desc>Left column shows four scattered, tilted browser-tab shapes connected by crossing dashed lines, representing manual research across many tabs. Right column shows a clean hub-and-node diagram, representing a single connected workflow via MCP.</desc>

<rect x="0" y="0" width="1200" height="560" fill="#12141C"/>

<line x1="600" y1="70" x2="600" y2="480" stroke="#3A3F4E" stroke-width="1" opacity="0.5"/>

<!-- LEFT: without MCP -->
<text x="80" y="106" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#8B93A6">Without MCP</text>
<text x="80" y="134" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6472">Manual research</text>

<!-- crossing dashed lines suggesting chaos, drawn under the tabs -->
<line x1="190" y1="235" x2="410" y2="345" stroke="#5B6472" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
<line x1="370" y1="215" x2="230" y2="345" stroke="#5B6472" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
<line x1="190" y1="235" x2="370" y2="215" stroke="#5B6472" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
<line x1="230" y1="345" x2="410" y2="345" stroke="#5B6472" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

<g transform="rotate(-6 190 235)">
<rect x="120" y="190" width="140" height="90" rx="8" fill="#1B2030" stroke="#5B6472" stroke-width="1.5"/>
<text x="190" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B93A6">Docs</text>
<text x="190" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B93A6">(which version?)</text>
</g>

<g transform="rotate(4 370 215)">
<rect x="300" y="170" width="140" height="90" rx="8" fill="#1B2030" stroke="#5B6472" stroke-width="1.5"/>
<text x="370" y="219" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B93A6">GitHub tab</text>
</g>

<g transform="rotate(3 230 345)">
<rect x="160" y="300" width="140" height="90" rx="8" fill="#1B2030" stroke="#5B6472" stroke-width="1.5"/>
<text x="230" y="349" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B93A6">Forum thread</text>
</g>

<g transform="rotate(-5 410 345)">
<rect x="340" y="300" width="140" height="90" rx="8" fill="#1B2030" stroke="#5B6472" stroke-width="1.5"/>
<text x="410" y="339" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B93A6">Terminal</text>
<text x="410" y="357" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8B93A6">output</text>
</g>

<text x="310" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8B93A6">Switch tabs, guess versions,</text>
<text x="310" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8B93A6">hope it&#8217;s current.</text>

<!-- RIGHT: with MCP -->
<text x="660" y="106" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F4F1EA">With MCP</text>
<text x="660" y="134" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6E8BE8">Connected context</text>

<line x1="760" y1="182" x2="890" y2="300" stroke="#3E63DD" stroke-width="3" opacity="0.9"/>
<line x1="1020" y1="182" x2="890" y2="300" stroke="#3E63DD" stroke-width="3" opacity="0.9"/>

<circle cx="760" cy="180" r="42" fill="#1B2030" stroke="#3E63DD" stroke-width="2"/>
<text x="760" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F4F1EA">Astro</text>
<text x="760" y="191" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F4F1EA">docs</text>

<circle cx="1020" cy="180" r="42" fill="#1B2030" stroke="#3E63DD" stroke-width="2"/>
<text x="1020" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F4F1EA">GitHub</text>

<circle cx="890" cy="300" r="72" fill="#1B2030" stroke="#3E63DD" stroke-width="3"/>
<text x="890" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F4F1EA">Editor</text>
<text x="890" y="313" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F4F1EA">context</text>

<text x="890" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C7CEDB">Ask directly, get sourced,</text>
<text x="890" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#C7CEDB">stay in flow.</text>

</svg>
